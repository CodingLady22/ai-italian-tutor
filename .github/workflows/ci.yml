name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: lint and build the React app
  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm ci
        working-directory: client

      - name: lint the code
        run: npm run lint
        working-directory: client

      - name: build the app
        run: npm run build
        working-directory: client

  # Job 2: lint, test and build the NestJS API
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run build
        working-directory: server
